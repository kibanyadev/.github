name: 'Reusable: Site CI'

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Node version file, path from the repository root
        type: string
        default: .nvmrc
      working-directory:
        description: Directory holding package.json and pnpm-lock.yaml
        type: string
        default: .
      scripts:
        description: Space-separated pnpm scripts, run in order
        type: string
        default: verify
      playwright-filter:
        description: pnpm --filter selector of the package to install Playwright Chromium for; empty skips Playwright
        type: string
        default: ''
      traces-path:
        description: Glob of Playwright results uploaded on failure (only with playwright-filter). Resolved from the workspace root, not working-directory (uses steps ignore defaults.run). Empty means <working-directory>/apps/*/test-results/
        type: string
        default: ''
      artifact-name:
        description: Name of the uploaded traces artifact; set a distinct one when a run calls this workflow more than once
        type: string
        default: playwright-test-results
      timeout-minutes:
        description: Job timeout
        type: number
        default: 15

permissions: {}

jobs:
  site-checks:
    name: Site Checks
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: inputs.playwright-filter != ''
        env:
          PLAYWRIGHT_FILTER: ${{ inputs.playwright-filter }}
        run: pnpm --filter "$PLAYWRIGHT_FILTER" exec playwright install --with-deps chromium

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          set -f
          read -r -a list <<< "$SCRIPTS"
          if [ "${#list[@]}" -eq 0 ]; then
            echo "scripts input is empty" >&2
            exit 1
          fi
          for script in "${list[@]}"; do
            if [[ ! "$script" =~ ^[A-Za-z0-9_][A-Za-z0-9:_.-]*$ ]]; then
              echo "Invalid script name: $script" >&2
              exit 1
            fi
          done
          for script in "${list[@]}"; do
            echo "::group::pnpm run $script"
            pnpm run "$script"
            echo "::endgroup::"
          done

      - name: Upload Playwright traces
        if: failure() && inputs.playwright-filter != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.traces-path != '' && inputs.traces-path || format('{0}/apps/*/test-results/', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: ignore
