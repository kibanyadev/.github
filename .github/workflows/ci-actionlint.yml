name: 'CI: Actionlint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '30 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-actionlint.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
