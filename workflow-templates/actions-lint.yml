name: 'CI: Actions Lint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '30 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: kibanyadev/.github/.github/workflows/reusable-actionlint.yml@5363fd3d2c7bc0a6f00f69bda52352264765628d # v1.0.0

  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: kibanyadev/.github/.github/workflows/reusable-zizmor.yml@5363fd3d2c7bc0a6f00f69bda52352264765628d # v1.0.0
